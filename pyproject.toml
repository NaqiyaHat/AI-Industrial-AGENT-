[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdm-agent"
version = "0.1.0"
description = "An AI agent for predictive maintenance: sensor alarms, trend forecasts, diagnosis and work orders, powered by Claude."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.60"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pdm-agent = "pdm_agent.cli:main"

[tool.setuptools]
packages = ["pdm_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
